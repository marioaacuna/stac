KEYPOINT_INITIAL_OFFSETS:
  # For joints, the offset is now [0,0,0] because the keypoint is paired
  # with the body that originates at that joint's center of rotation.
  AnkleL: [0., 0., 0.]
  AnkleR: [0., 0., 0.]
  EarL: [0., 0., 0.]
  EarR: [0., 0., 0.]
  ElbowL: [0., 0., 0.]
  ElbowR: [0., 0., 0.]
  # Offset from the finger joint origin to the center of the paw tip.
  #ForepawL: [-0.0015, 0.0, 0.0]
  #ForepawR: [-0.0015, 0.0, 0.0]
  ForepawL: [-0.0005, 0.0, 0.0]
  ForepawR: [-0.0005, 0.0, 0.0]
  
  # Offset from the toe joint origin to the center of the hindpaw tip.
  #HindpawL: [-0.0026, 0.0, 0.0]
  #HindpawR: [-0.0026, 0.0, 0.0]
  HindpawL: [-0.0016, 0.0, 0.0]
  HindpawR: [-0.0016, 0.0, 0.0]
  
  KneeL: [0., 0., 0.]
  KneeR: [0., 0., 0.]
  ShoulderL: [0., 0., 0.]
  ShoulderR: [0., 0., 0.]
  Snout: [-0.001, 0.0, -0.001] #
  SpineF: [0., 0., 0.]
  # A non-zero guess for the mid-spine marker relative to the pelvis origin.
  SpineM: [-0.0015, 0.0, 0.00]
  # The origin of vertebra_C1 is the base of the tail, so the offset is zero.
  Tail_base_: [0., 0., 0.]
  Tail_end_: [0., 0., 0.]
  Tail_mid_: [0., 0., 0.]
  WristL: [0., 0., 0.]
  WristR: [0., 0., 0.]

